<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Quiz App</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');

body {
    font-family: 'Comic Neue', cursive;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    animation: backgroundShift 10s ease infinite alternate;
}

@keyframes backgroundShift {
    0% {background-position: 0 0;}
    100% {background-position: 100% 100%;}
}

.quiz-container {
    background: #fff3e0;
    padding: 40px 30px;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    max-width: 600px;
    width: 90%;
    text-align: center;
    position: relative;
    overflow: hidden;
}

h2 {
    font-size: 28px;
    color: #ff6f61;
    margin-bottom: 25px;
    text-shadow: 2px 2px #ffe4c4;
    animation: bounce 1.5s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.question {
    font-size: 20px;
    margin-bottom: 20px;
    color: #6a1b9a;
}

.options {
    list-style: none;
    padding: 0;
}

.options li {
    background: #ffcc80;
    padding: 12px 20px;
    margin: 10px 0;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
    transition: 0.3s;
    box-shadow: 0 5px #ffb74d;
    position: relative;
}

.options li:hover {
    background: #ffd54f;
    transform: translateY(-3px);
}

.correct {
    background: #8bc34a !important;
    box-shadow: 0 5px #689f38;
    color: white;
}

.wrong {
    background: #f44336 !important;
    box-shadow: 0 5px #d32f2f;
    color: white;
}

.next-btn {
    margin-top: 25px;
    padding: 12px 25px;
    background: #29b6f6;
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 6px #0288d1;
    transition: 0.3s;
}

.next-btn:hover {
    background: #03a9f4;
    transform: translateY(-3px);
}

.score-container {
    font-size: 26px;
    font-weight: bold;
    text-shadow: 2px 2px #fff3e0;
    animation: fadeIn 1s ease forwards;
}

.pass {
    color: #4caf50;
}

.fail {
    color: #f44336;
}

@keyframes fadeIn {
    from {opacity:0; transform: scale(0.8);}
    to {opacity:1; transform: scale(1);}
}

/* Emoji icons */
.options li::before {
    content: "🟢 ";
    margin-right: 10px;
}

.options li.wrong::before { content: "❌ "; }
.options li.correct::before { content: "✅ "; }
</style>
</head>
<body>

<div class="quiz-container">
    <h2>Dynamic Quiz App</h2>
    <div id="quiz"></div>
</div>

<!-- Sounds -->
<audio id="passSound" src="https://www.soundjay.com/human/applause-01.mp3"></audio>
<audio id="failSound" src="https://www.soundjay.com/button/beep-10.mp3"></audio>

<script>
const quizData = [
    { question: "Which company developed JavaScript?", options: ["Microsoft", "Netscape", "Sun Microsystems", "Oracle"], answer: "Netscape" },
    { question: "Which symbol is used for comments in JavaScript?", options: ["//", "/* */", "#", "<!-- -->"], answer: "//" },
    { question: "Which method converts JSON to a JavaScript object?", options: ["JSON.parse()", "JSON.stringify()", "JSON.convert()", "JSON.objectify()"], answer: "JSON.parse()" },
    { question: "Which keyword declares a block-scoped variable?", options: ["var", "let", "const", "Both let and const"], answer: "Both let and const" },
    { question: "jQuery is a library for which language?", options: ["Java", "JavaScript", "Python", "C#"], answer: "JavaScript" },
    { question: "Which method is used to hide elements in jQuery?", options: [".hide()", ".remove()", ".displayNone()", ".invisible()"], answer: ".hide()" },
    { question: "What does === mean in JavaScript?", options: ["Assignment", "Equality without type conversion", "Equality with type conversion", "Not equal"], answer: "Equality without type conversion" },
    { question: "Which function is used to delay execution in JavaScript?", options: ["setTimeout()", "setDelay()", "wait()", "sleep()"], answer: "setTimeout()" },
    { question: "Which event occurs when a user clicks on an element?", options: ["onhover", "onclick", "onload", "onchange"], answer: "onclick" },
    { question: "Which property gets the content of an input field in jQuery?", options: [".val()", ".text()", ".html()", ".content()"], answer: ".val()" }
];

let currentQuestion = 0;
let score = 0;
const quiz = document.getElementById('quiz');

function loadQuestion() {
    if (currentQuestion >= quizData.length) {
        showResult();
        return;
    }

    const q = quizData[currentQuestion];
    let optionsHtml = '';
    q.options.forEach(option => {
        optionsHtml += `<li onclick="selectOption(this, '${q.answer}')">${option}</li>`;
    });

    quiz.innerHTML = `
        <div class="question">🌟 ${q.question}</div>
        <ul class="options">${optionsHtml}</ul>
        <button class="next-btn" onclick="nextQuestion()">Next ➡️</button>
    `;
}

function selectOption(selected, correctAnswer) {
    const options = document.querySelectorAll('.options li');
    options.forEach(option => {
        option.style.pointerEvents = 'none';
        if (option.innerText === correctAnswer) option.classList.add('correct');
    });

    if (selected.innerText === correctAnswer) score++;
    selected.classList.add(selected.innerText === correctAnswer ? 'correct' : 'wrong');
}

function nextQuestion() {
    currentQuestion++;
    loadQuestion();
}

function showResult() {
    const pass = score / quizData.length >= 0.5;
    const sound = document.getElementById(pass ? 'passSound' : 'failSound');
    sound.play();

    quiz.innerHTML = `
        <div class="score-container ${pass ? 'pass' : 'fail'}">
            ${pass ? '🎉 Congratulations! 🎉' : '❌ You Failed ❌'}<br>
            Your score: ${score} / ${quizData.length}
        </div>
    `;

    // Confetti effect if passed
    if (pass) {
        createConfetti();
    }
}

// Simple confetti animation
function createConfetti() {
    const confettiCount = 100;
    for(let i=0;i<confettiCount;i++){
        const confetti = document.createElement('div');
        confetti.innerText = '🎊';
        confetti.style.position = 'fixed';
        confetti.style.top = '-50px';
        confetti.style.left = Math.random()*window.innerWidth+'px';
        confetti.style.fontSize = Math.random()*24 + 12+'px';
        confetti.style.animation = `fall ${2+Math.random()*3}s linear forwards`;
        document.body.appendChild(confetti);
        setTimeout(()=>confetti.remove(), 5000);
    }
}

const style = document.createElement('style');
style.innerHTML = `
@keyframes fall {
    to { transform: translateY(100vh) rotate(360deg); }
}`;
document.head.appendChild(style);

loadQuestion();
</script>

</body>
</html>
